<text class="sans" x="44" y="76" font-size="13.5" fill="#94A3B8"><tspan x="44" dy="0">App mobile para encontrar, cadastrar e favoritar pontos de coleta de materiais recicláveis, com mapa, foto e</tspan><tspan x="44" dy="19">GPS. Expo/React Native e API REST em Node.js, Express, TypeScript e MySQL.</tspan></text>
</g>
