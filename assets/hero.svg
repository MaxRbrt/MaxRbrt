stroke-dasharray="2 9"/><text class="mono surgir" style="animation-delay:0.15s" x="240" y="66" font-size="14" fill="#2DD4BF">@maxrbrt</text>
<text class="sans surgir" style="animation-delay:0.3s" x="238" y="106" font-size="36" font-weight="800" letter-spacing="-.6" fill="#E6EDF3">Marcos Roberto</text>
