</g></g><g class="surgir" style="animation-delay:1.02s"><g>
<rect x="465.04" y="180" width="58.92" height="23" rx="11.5"
fill="#2DD4BF" fill-opacity=".08" stroke="#2DD4BF" stroke-opacity=".45"/>
<text class="mono" x="494.5" y="195.46" font-size="11"
text-anchor="middle" fill="#6EE7B7">NestJS</text>
</g></g><g class="surgir" style="animation-delay:1.11s"><g>
<rect x="530.96" y="180" width="52.1" height="23" rx="11.5"
