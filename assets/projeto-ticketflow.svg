<svg xmlns="http://www.w3.org/2000/svg" width="860" height="176" viewBox="0 0 860 176" role="img" aria-label="Projeto TicketFlow: Help desk em tempo real: chamados, chat ao vivo, metas de SLA, relatórios e base de conhecimento. Vue 3, Vite, Pinia, Firebase Auth e Firestore com acesso por perfil.">
<title>Projeto TicketFlow: Help desk em tempo real: chamados, chat ao vivo, metas de SLA, relatórios e base de conhecimento. Vue 3, Vite, Pinia, Firebase Auth e Firestore com acesso por perfil.</title>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.surgir{opacity:0;animation:surgir .8s cubic-bezier(.2,.7,.2,1) forwards}
.borda-viva{animation:bordaViva 4.8s ease-in-out infinite}
.piscar{animation:piscar 1.1s steps(1) infinite}
@keyframes surgir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bordaViva{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
@keyframes piscar{0%{opacity:1}50%{opacity:0}}

.trilho{transform-box:fill-box;transform-origin:center top;animation:crescerTrilho 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes crescerTrilho{from{transform:scaleY(0)}to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.surgir{opacity:1}
.so-animado{display:none}
}
</style>
<defs>
<linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2DD4BF"/>
<stop offset=".55" stop-color="#22D3EE" stop-opacity=".55"/>
<stop offset="1" stop-color="#34D399"/>
</linearGradient>
<linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#111827"/>
<stop offset="1" stop-color="#0D1117"/>
</linearGradient>
<linearGradient id="destaque" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6EE7B7"/>
<stop offset=".5" stop-color="#2DD4BF"/>
<stop offset="1" stop-color="#22D3EE"/>
</linearGradient>
<radialGradient id="auraLateral" cx="0" cy="88" r="473"
gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2DD4BF" stop-opacity=".17"/>
<stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="linhaTopo" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
<stop offset=".5" stop-color="#6EE7B7" stop-opacity=".9"/>
<stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>
<filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="2.4" result="desfoque"/>
<feMerge><feMergeNode in="desfoque"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x=".5" y=".5" width="859" height="175" rx="18" fill="url(#fundo)"/>
<rect x=".5" y=".5" width="859" height="175" rx="18" fill="url(#auraLateral)"/>
<rect x="7.5" y="7.5" width="845" height="161" rx="12" fill="none"
stroke="#30363D" stroke-opacity=".55"/>
